<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نظام إدارة الأنشطة والتصويت | جامعة الانبار</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=5.0">
  <!-- xlsx library for Excel import/export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<!-- ══════════════════════════════════════
     LOGIN PAGE
══════════════════════════════════════ -->
<div id="login-page">
  <div class="login-wrapper" style="display:flex;min-height:100vh;align-items:center;justify-content:center;background:#0f172a;padding:2rem">
    <div style="background:#ffffff;border-radius:24px;padding:3.5rem 3rem;width:100%;max-width:460px;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5)">
      <div style="text-align:center;margin-bottom:2.2rem">
        <div style="width:64px;height:64px;background:#2563eb;color:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 1.2rem;box-shadow:0 10px 20px rgba(37,99,235,0.3)">🏛️</div>
        <h2 style="font-size:1.45rem;font-weight:700;color:#0f172a;margin-bottom:.3rem">جامعة الانبار</h2>
        <p style="font-size:.9rem;color:#64748b;font-weight:500">وحدة التنمية المستدامة | نظام الأنشطة والتصويت</p>
      </div>

      <div id="login-alert"></div>

      <div class="form-group" style="margin-bottom:1.4rem">
        <label style="display:block;font-weight:600;margin-bottom:.5rem;font-size:.88rem;color:#334155">اسم المستخدم</label>
        <input class="form-control" id="login-user" placeholder="أدخل اسم المستخدم" autocomplete="username" style="width:100%;padding:.85rem 1rem;border:1.5px solid #e2e8f0;border-radius:10px;font-family:inherit;font-size:.95rem">
      </div>

      <div class="form-group" style="margin-bottom:1.8rem">
        <label style="display:block;font-weight:600;margin-bottom:.5rem;font-size:.88rem;color:#334155">كلمة المرور</label>
        <input class="form-control" type="password" id="login-pass" placeholder="أدخل كلمة المرور" onkeydown="if(event.key==='Enter') Auth.doLogin()" style="width:100%;padding:.85rem 1rem;border:1.5px solid #e2e8f0;border-radius:10px;font-family:inherit;font-size:.95rem">
      </div>

      <button class="btn btn-primary btn-block" onclick="Auth.doLogin()" style="width:100%;padding:1rem;font-size:1rem;border-radius:10px;font-weight:600">
        تسجيل الدخول للنظام
      </button>

      <div style="text-align:center;margin-top:2rem;padding-top:1.2rem;border-top:1px solid #f1f5f9;color:#94a3b8;font-size:.8rem">
        البوابة الرسمية لاعتماد وتقييم الأنشطة
      </div>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════════
     MAIN APPLICATION SHELL (EXECUTIVE)
══════════════════════════════════════ -->
<div id="app">
  <div class="main-layout">
    
    <!-- Modern Side Navigation -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-brand-box">
          <div class="sidebar-brand-icon">🏛️</div>
          <div>
            <div class="sidebar-brand-title">جامعة الانبار</div>
            <div class="sidebar-brand-sub">وحدة التنمية المستدامة</div>
          </div>
        </div>
        <button class="sidebar-close-btn" onclick="UI.toggleSidebar()" title="إغلاق القائمة">✕</button>
      </div>
      <div id="sidebar-nav-container"></div>
    </aside>

    <!-- Sidebar Backdrop Overlay (Mobile) -->
    <div class="sidebar-backdrop" id="sidebar-backdrop" onclick="UI.toggleSidebar()"></div>

    <!-- Content Workspace Area -->
    <div class="main-wrapper">
      
      <!-- Top Header Navigation -->
      <header class="topbar">
        <div class="topbar-left-meta">
          <button class="btn btn-sm btn-ghost" id="mob-menu" onclick="UI.toggleSidebar()">☰</button>
          <span class="topbar-title-text" style="color:#64748b">نظام إدارة الأنشطة والتصويت والاستمارات الإلكترونية</span>
        </div>
        <div class="topbar-right">
          <div class="user-profile-badge">
            <div class="user-avatar-circle" id="topbar-avatar">م</div>
            <div style="text-align:right">
              <div id="topbar-name" style="font-weight:700;font-size:.88rem;color:#0f172a">المدير</div>
              <div id="topbar-sub" style="font-size:.72rem;color:#64748b">المدير الرئيسي</div>
            </div>
            <div id="topbar-badge" style="margin-right:0.4rem"></div>
          </div>
          <button class="btn btn-sm btn-outline" onclick="Auth.logout()" style="color:#ef4444;border-color:#fecaca">خروج</button>
        </div>
      </header>

      <!-- Main Dynamic Content -->
      <main class="content" id="main-content"></main>
    </div>

  </div>
</div>

<!-- ══════════════════════════════════════
     FLOATING ACTION BUTTON (+)
══════════════════════════════════════ -->
<button id="fab-create-form"
  onclick="FormBuilder.createModal()"
  title="إنشاء استمارة ومتطلبات جديدة"
  style="display:none;position:fixed;bottom:2.2rem;left:2.2rem;z-index:500;
    width:58px;height:58px;border-radius:50%;border:none;
    background:#2563eb;color:#fff;font-size:2rem;
    cursor:pointer;box-shadow:0 10px 25px rgba(37,99,235,0.4);
    align-items:center;justify-content:center;transition:transform .2s">
  +
</button>

<!-- ══════════════════════════════════════
     MODAL & TOAST
══════════════════════════════════════ -->
<div class="modal-overlay" id="modal" onclick="if(event.target===this) UI.closeModal()">
  <div class="modal">
    <button class="modal-close" onclick="UI.closeModal()">×</button>
    <div id="modal-body"></div>
  </div>
</div>

<div id="toast"></div>

<!-- ══════════════════════════════════════
     SCRIPTS
══════════════════════════════════════ -->
<script src="js/api.js?v=6.0"></script>
<script src="js/ui.js?v=6.0"></script>
<script src="js/activities.js?v=6.0"></script>
<script src="js/forms.js?v=6.0"></script>
<script src="js/auth.js?v=6.0"></script>
<script src="js/app.js?v=6.0"></script>

</body>
</html>
